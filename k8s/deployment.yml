apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-app
  namespace: argo-app
spec:
  selector:
    matchLabels:
      app: argo-app
  template:
    metadata:
      labels:
        app: argo-app
    spec:
      containers:
      - name: argo-app
        image: vimalr/argo-app:3bc8dc4575ec45203581917a59fc597608106340
        ports:
        - containerPort: 80


