apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-app
  namespace: argo-app
spec:
  selector:
    matchLabels:
      app: argo-app
  template:
    metadata:
      labels:
        app: argo-app
    spec:
      containers:
      - name: argo-app
        image: vimalr/argo-app:a2f9f383a30c51c765703ace8f6844327d3eced7
        ports:
        - containerPort: 80


