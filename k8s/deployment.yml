apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-app
  namespace: argo-app
spec:
  selector:
    matchLabels:
      app: argo-app
  template:
    metadata:
      labels:
        app: argo-app
    spec:
      containers:
      - name: argo-app
        image: vimalr/argo-app:a0109e8f69442844f1a315d9629fcaab7037d41b
        ports:
        - containerPort: 80


