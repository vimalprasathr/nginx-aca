name: Build and Push Image + Update GitOps Repo

on:
  push:
  #  branches:
  #    - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t vimalr/myappnginx:$IMAGE_TAG .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Image
        run: |
          docker push vimalr/myappnginx:${{ env.IMAGE_TAG }}

      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:

          repository: ${{ secrets.GITOPS_REPO }}
          token: ${{ secrets.GH_TOKEN }}
          ref: argo-cd
          path: k8s


      - name: Update Image Tag in Dev
        run: |
          sed -i "s|image:.*|image: vimalr/myappnginx:${{ env.IMAGE_TAG }}|g" gitops/dev/deployment.yaml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          path: gitops
          commit-message: "Update dev image tag to ${{ env.IMAGE_TAG }}"
          branch: update-image-${{ env.IMAGE_TAG }}
          title: "Update image to ${{ env.IMAGE_TAG }}"
          body: "Auto update image tag after CI build"
